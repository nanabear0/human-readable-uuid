name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const pkg = require('./package.json'); const expected = 'v' + pkg.version; if (process.env.RELEASE_TAG !== expected) { throw new Error('Release tag must be ' + expected + ', got ' + process.env.RELEASE_TAG); }"

      - name: Test package
        run: npm test

      - name: Publish package
        run: npm publish --access public
