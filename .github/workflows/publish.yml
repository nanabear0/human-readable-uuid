name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          node -e "const pkg = require('./package.json'); const requested = process.env.RELEASE_VERSION.replace(/^v/, ''); if (requested !== pkg.version) { throw new Error('Release version must be ' + pkg.version + ', got ' + process.env.RELEASE_VERSION); }"

      - name: Test package
        run: npm test

      - name: Pack package
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets >/dev/null
          PACKAGE_TARBALL=$(find release-assets -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$PACKAGE_TARBALL"
          echo "PACKAGE_TARBALL=$PACKAGE_TARBALL" >> "$GITHUB_ENV"

      - name: Publish package
        run: npm publish "release-assets/$PACKAGE_TARBALL" --access public

      - name: Upload package to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "release-assets/$PACKAGE_TARBALL" --clobber
