name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          node -e "const pkg = require('./package.json'); const requested = process.env.RELEASE_VERSION.replace(/^v/, ''); if (requested !== pkg.version) { throw new Error('Release version must be ' + pkg.version + ', got ' + process.env.RELEASE_VERSION); }"

      - name: Test package
        run: npm test

      - name: Publish package
        run: npm publish --access public
